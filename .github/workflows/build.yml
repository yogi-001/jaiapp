name: Build Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Linux Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          zip unzip git openjdk-17-jdk \
          build-essential autoconf libtool \
          pkg-config zlib1g-dev

    - name: Install Python Packages
      run: |
       pip install --upgrade pip
       pip install setuptools==69.5.1
       pip install wheel
       pip install cython==0.29.36
       pip install buildozer==1.5.0
       pip install python-for-android==2024.01.21

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses > /dev/null

    - name: Install SDK Packages
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk

    - name: Install libtool
      run: |
       sudo apt update
       sudo apt install -y libtool autoconf automake
    
    - name: Install system dependencies
      run: |
       sudo apt update
       sudo apt install -y \
        zip unzip autoconf automake libtool \
        pkg-config zlib1g-dev build-essential \
        libffi-dev

    - name: Clear cache
      run: rm -rf .buildozer

    - name: Clean build
      run: rm -rf .buildozer bin